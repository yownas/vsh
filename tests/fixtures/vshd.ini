# vshd.ini shared by the unit and integration tiers.
#
# alice        - daily admin, member of wheel
# alice+admin  - alice's role key, may also start/stop/move
# bob          - may only use db01 and the gw2 proxy client
# carol        - created by the onboarding test, web01 only
[groups]
wheel:alice,alice+admin
admins:alice+admin

[containers]
web01.vsh.test:@wheel,carol
db01.vsh.test:@wheel,bob
app01.vsh.test:@wheel
gw:@wheel
gw2:@wheel,bob

[hosts]
*:@wheel

[operations]
move:@admins
startstop:@admins

[modules]
*:@wheel
